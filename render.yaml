services:
  - type: web
    name: kart-paddock-a
    runtime: node
    plan: free
    region: oregon
    rootDir: games/a
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
